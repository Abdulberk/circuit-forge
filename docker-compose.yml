version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: circuitforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: circuitforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: circuitforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: circuitforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc
    container_name: circuitforge-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/circuitforge --ignore-existing;
      mc anonymous set download myminio/circuitforge;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: circuitforge-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/circuitforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: circuitforge
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: dev-jwt-secret-min-32-characters-long
      JWT_REFRESH_SECRET: dev-refresh-secret-min-32-characters-long
      NODE_ENV: development
      API_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules

  worker-sim:
    build:
      context: .
      dockerfile: infra/docker/worker-sim.Dockerfile
    container_name: circuitforge-worker-sim
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/circuitforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: circuitforge
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      SIM_TIMEOUT_MS: 10000
      SIM_MAX_OUTPUT_BYTES: 5242880
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/worker-sim:/app/apps/worker-sim
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/worker-sim/node_modules

volumes:
  postgres-data:
  redis-data:
  minio-data: