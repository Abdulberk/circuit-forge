version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: circuitforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: circuitforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: circuitforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: circuitforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc
    container_name: circuitforge-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/circuitforge --ignore-existing;
      mc anonymous set download myminio/circuitforge;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      # DEV target: source is bind-mounted below + the CMD is `pnpm run dev` (nest --watch). Without an
      # explicit target, compose builds the final (production) stage, whose `node dist/main.js` CMD does
      # not match the mounted-source dev flow — and its builder stage runs a full type-check build here.
      target: development
    container_name: circuitforge-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/circuitforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: circuitforge
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: dev-jwt-secret-min-32-characters-long
      JWT_REFRESH_SECRET: dev-refresh-secret-min-32-characters-long
      NODE_ENV: development
      API_PORT: 3000
      # Observability — uncomment to emit traces/metrics to the otel-lgtm viewer (start the stack with
      # `docker compose --profile observability up`). View at http://localhost:3030.
      # OTEL_ENABLED: "true"
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      # NOTE: ./packages is intentionally NOT bind-mounted. On a Windows host the mount would shadow the
      # image's Linux node_modules with pnpm's host junction symlinks (which don't resolve in the container
      # → eda-core can't require('zod'), tsc widens its types to any). The image bakes BUILT packages
      # instead; editing a shared package during api dev therefore needs an image rebuild (they change rarely).
      - /app/node_modules
      - /app/apps/api/node_modules

  worker-sim:
    build:
      context: .
      dockerfile: infra/docker/worker-sim.Dockerfile
    container_name: circuitforge-worker-sim
    # Least-privilege containment for the tier that runs untrusted ngspice. Host-independent (no
    # user-namespace / seccomp relaxation, unlike bubblewrap) and stacked UNDER the in-process rlimit
    # wrapper. The worker image runs the WHOLE process as a single non-root user (ngsim) — no su-exec,
    # no second user — so the container needs NO Linux capabilities at all.
    #   - read_only root + tmpfs (mode 1777 so the non-root user can create per-job dirs): the only writable
    #     paths are the per-job temp areas. SIM_TEMP_DIR=/tmp/sim is where job dirs live; /tmp is needed
    #     because ngspice spools `.control` blocks there via libc tmpfile() (which ignores $TMPDIR). The
    #     built image needs no other writes. NOTE: the dev source-mount flow (volumes below) keeps paths
    #     writable; confirm read_only + USER ngsim with a container smoke-test before a prod rollout.
    #   - cap_drop ALL with NO re-add — the single-uid worker performs no privilege transition, so it needs
    #     zero capabilities (NET_RAW, SYS_ADMIN, SETUID, CHOWN, … all removed).
    #   - no-new-privileges: belt-and-suspenders — no setuid-bit escalation is ever possible.
    #   - pids_limit / mem_limit: container-wide ceilings so a runaway sim can't exhaust processes or memory.
    #     mem_limit is a cgroup RSS cap — stronger than the per-process RLIMIT_AS the wrapper sets, and (with
    #     one uid) pids_limit is the hard process ceiling backing the per-uid RLIMIT_NPROC. (The worker KEEPS
    #     normal networking: it must reach Postgres/Redis/MinIO. ngspice itself needs no network; isolating
    #     the child's network is the optional, host-conditional bubblewrap follow-up.)
    read_only: true
    tmpfs:
      - /tmp/sim:mode=1777
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/circuitforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: circuitforge
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      SIM_TIMEOUT_MS: 10000
      SIM_MAX_OUTPUT_BYTES: 5242880
      NODE_ENV: development
      # AI DESIGN LOOP: when an LLM key is present the worker ALSO hosts the agentic 'design' queue (it runs
      # the same llm-core runDesignLoop the API does, with ngspice local — see apps/worker-sim/src/main.ts).
      # Without a key the worker processes simulations ONLY (the design worker is not started). LLM_API_KEY is
      # a SECRET: interpolated from the compose-project .env / shell, never hardcoded. ngspice is on PATH in the
      # image, so NGSPICE_PATH is left at its 'ngspice' default (the ngspice_con.exe path is a Windows-dev-host
      # concern only). If you run async /design-jobs without setting this, jobs sit QUEUED with no consumer.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-4-8}
      # CRITICAL: LLM_BASE_URL must match the API key's provider. llm-core defaults to a GATEWAY base URL when
      # this is unset, so a direct-Anthropic key with no LLM_BASE_URL is silently sent to the gateway and 401s
      # (the exact silent-failure the worker container smoke test caught). Passed through from the project .env;
      # set it to match your key. LLM_USER_AGENT is optional (llm-core sends a neutral UA by default).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_USER_AGENT: ${LLM_USER_AGENT:-}
      # Optional design admission-control quotas (unset = unlimited; mirror QUOTA_DESIGN_* on the API):
      # QUOTA_DESIGN_CONCURRENT_PER_ORG: "3"
      # QUOTA_DESIGN_JOBS_PER_MONTH: "200"
      # OPTIONAL bubblewrap isolation of the ngspice child (default OFF). On a host you control (e.g. a
      # self-managed EC2 / K8s node) you can give ngspice its own mount/PID + NETWORK namespace. To enable:
      #   1) set SIM_BWRAP: "1"
      #   2) relax seccomp so bubblewrap can create an unprivileged user namespace — add
      #      `security_opt: [seccomp=unconfined]` here (trusted host) or a custom profile that allows
      #      clone/unshare with CLONE_NEWUSER; AND ensure the host kernel permits unprivileged userns
      #      (sysctl kernel.unprivileged_userns_clone=1 / user.max_user_namespaces>0 — on by default on AL2023).
      # The worker PREFLIGHTS at startup: if the host can't create the namespaces it logs loudly and falls
      # back to the rlimit + non-root hardening, so enabling it can never break job processing. See SECURITY.md §5.4.
      # SIM_BWRAP: "1"
      # Observability — uncomment to emit traces/metrics to the otel-lgtm viewer (see the api service).
      # OTEL_ENABLED: "true"
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/worker-sim:/app/apps/worker-sim
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/worker-sim/node_modules

  # PCB layout worker — consumes the 'pcb-layout' queue and runs pcb-core's quality pipeline natively
  # (freerouting + kicad-cli, baked into the image). NO source volume mounts: the image is a self-contained
  # `pnpm deploy` bundle; mounting the workspace over it would shadow the baked node_modules + toolchain.
  pcb-worker:
    build:
      context: .
      dockerfile: docker/pcb-worker/Dockerfile
    container_name: circuitforge-pcb-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/circuitforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: circuitforge
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      PCB_QUEUE_NAME: pcb-layout
      PCB_CONCURRENCY: "1"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Observability viewer (OPT-IN): Grafana + Tempo (traces) + Prometheus/Mimir (metrics), all-in-one.
  # Behind a compose profile so the default `docker compose up` stays lean. Start it with:
  #   docker compose --profile observability up -d otel-lgtm
  # then enable telemetry on the apps (OTEL_ENABLED=true + OTEL_EXPORTER_OTLP_ENDPOINT) and open
  # Grafana at http://localhost:3030. Dev/ephemeral (no volume → restart clears data); NOT for production
  # — see docs/OBSERVABILITY.md §6 (local) and §7 (production).
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: circuitforge-otel-lgtm
    profiles: ["observability"]
    ports:
      - "3030:3000"   # Grafana UI (host 3030 — the API already uses 3000)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  →  OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    volumes:
      # Auto-provision the Circuit Forge dashboard + alert rules every start (so they're always there,
      # no manual import / no querying by hand). Read-only mounts into Grafana's provisioning dirs.
      - ./infra/observability/grafana/dashboards:/etc/circuit-forge/dashboards:ro
      - ./infra/observability/grafana/provisioning/dashboards/circuit-forge.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/circuit-forge.yaml:ro
      - ./infra/observability/grafana/provisioning/alerting/circuit-forge.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/circuit-forge.yaml:ro

volumes:
  postgres-data:
  redis-data:
  minio-data: