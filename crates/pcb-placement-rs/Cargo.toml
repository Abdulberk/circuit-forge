[package]
name = "pcb-placement-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic, connectivity-aware PCB placement kernel for Circuit Forge"
license = "MIT"
publish = false

[lib]
name = "pcb_placement_rs"
path = "src/lib.rs"

[[bin]]
name = "cf-pcb-place"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

