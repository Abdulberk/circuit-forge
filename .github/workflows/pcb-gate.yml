# PCB quality gate — the Docker-backed manufacturability check for pcb-core.
#
# Separate from ci.yml ON PURPOSE:
#   • it only runs when PCB code actually changes (native `paths:` filter — no third-party action,
#     honouring the "actions/* only" policy), so ordinary PRs are never slowed by the ~2-3GB KiCad pull;
#   • it needs Docker (freerouting 2.2.4 + kicad-cli 10 images) that the main test/matrix jobs don't.
#
# What it proves: `pnpm test:layout` routes the fixture circuits through the freerouting quality tier
# and the KiCad-10 DRC notary and comes back CLEAN. PCB_GATE_STRICT=1 turns a MISSING Docker image
# into a failure — in this gate "couldn't run" must never pass as green (the exact silent-green trap).
name: PCB quality gate

# NOTE on the filter: eda-core is listed because pcb-core imports it at BUILD AND RUNTIME — this
# workflow compiles it explicitly below for that reason. Without it, an eda-core change could break the
# layout pipeline and this gate would never run: the one dependency the gate needs but could not see.
# docker/pcb-runtime/Dockerfile is listed because it is where the EDA image digests are pinned, and
# scripts/lib/eda-images.mjs refuses to disagree with it. Bumping KiCad or freerouting there is precisely
# the moment this gate must run: it is the only thing that proves the new binary still routes and DRCs
# these boards clean. (The gate pulls those images; it still builds nothing from that directory.)
# Deliberately NOT listed: apps/pcb-worker/** (its unit tests run in ci.yml, which has no path filter,
# and layout-check.mjs exercises pcb-core rather than the worker).
on:
  pull_request:
    paths:
      - 'packages/pcb-core/**'
      - 'packages/eda-core/**'
      - 'scripts/layout-check.mjs'
      - 'scripts/pcb-invariants.mjs'
      - 'scripts/lib/**'
      - 'docker/pcb-runtime/Dockerfile'
      - '.github/workflows/pcb-gate.yml'
  push:
    branches: [main]
    paths:
      - 'packages/pcb-core/**'
      - 'packages/eda-core/**'
      - 'scripts/layout-check.mjs'
      - 'scripts/pcb-invariants.mjs'
      - 'scripts/lib/**'
      - 'docker/pcb-runtime/Dockerfile'
      - '.github/workflows/pcb-gate.yml'

concurrency:
  group: pcb-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: freerouting + KiCad-10 DRC (real Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22, NOT 20: tscircuit's local autorouter (@tscircuit/capacity-autorouter)
          # calls `.entries().map()` — an iterator-helper method that only exists in Node 22+.
          # On Node 20 the eval crashes with "o.entries(...).map is not a function", so the whole
          # PCB pipeline requires Node 22+ wherever it runs (this gate, and the future worker).
          node-version: 22

      - name: Install pnpm (pinned to package.json "packageManager")
        run: npm install -g pnpm@8.14.1

      - name: Install
        run: pnpm install --frozen-lockfile

      # pcb-core needs its workspace dependencies' `dist` to exist before `tsc` can resolve their types, so
      # they are built first — DERIVED from the dependency graph, never listed by hand.
      #
      # This step used to name `eda-core` and only `eda-core`, which was true when it was written and went
      # stale silently: pcb-core later grew imports of `pcb-contract` and `pcb-preflight` (the first was
      # extracted OUT of pcb-core precisely to keep a server toolchain out of a browser bundle), and nothing
      # brought the list along. The gate then failed with `Cannot find module '@circuit-forge/pcb-contract'`
      # — which reads as a missing package rather than an unbuilt one, so the message points away from the
      # cause. `...<pkg>` is pnpm's "this package and everything it depends on, in order", so the list
      # cannot fall behind the imports again.
      #
      # `<pkg>^...` is "everything <pkg> depends on, excluding <pkg> itself" — verified against this
      # workspace rather than taken from memory, because the neighbouring form points the other way:
      #   @circuit-forge/pcb-core...   → eda-core, pcb-contract, pcb-preflight, pcb-core
      #   ...@circuit-forge/pcb-core   → pcb-core, pcb-worker      (DEPENDENTS — the wrong direction)
      #   @circuit-forge/pcb-core^...  → eda-core, pcb-contract, pcb-preflight
      # The leading-dot form reads like the natural spelling of "and its dependencies" and is the opposite,
      # which would have left this step doing less than before while looking like a fix.
      - name: Build pcb-core's workspace dependencies
        run: pnpm --filter "@circuit-forge/pcb-core^..." build

      # The conservation gate runs BEFORE Docker on purpose: it needs neither, it finishes in ~20 ms, and
      # the defects it locks are the ones no downstream gate can see. A three-legged transistor on a 2-pad
      # footprint used to reach DRC as a four-pad board reporting unconnected=0 — a pin that never became
      # a port cannot appear as an unconnected item, so KiCad was structurally blind to it.
      #
      # It also enumerates the whole (component type × footprint string) product and prints the tally, so
      # a regression in the REPORTED half is visible in the log even while the LOCKED half is what fails
      # the build.
      - name: Conservation gate (pure — no Docker, no eval)
        run: |
          set -euo pipefail
          pnpm --filter @circuit-forge/pcb-core build
          node scripts/pcb-invariants.mjs

      # Caller-owned placements, through the whole entry function rather than the engine alone. It is a
      # script and not a spec for the reason pcb-core's jest config already documents: `layoutCircuit`
      # reaches the ESM-only footprinter through a dynamic import, which the flat CommonJS test transpile
      # cannot serve — so the entry point is only exercisable against the BUILT output, which this uses.
      # Both defects it guards survived a green engine suite and were found by running one real circuit:
      # pins honoured by the engine and then discarded by the HPWL gate, and an impossible pin set that was
      # reported as an error and shipped anyway.
      - name: Fixed-placement gate (pure — no Docker)
        run: |
          set -euo pipefail
          node scripts/pin-placement-check.mjs

      # Pull the images BY DIGEST, taken from the same module the harness uses, which in turn refuses to
      # disagree with docker/pcb-runtime/Dockerfile. This job used to pull the bare `kicad/kicad:10.0-full`
      # tag — a ROLLING tag upstream republishes for every 10.0.x patch — while production pinned a digest.
      # The day upstream moves that tag, this gate would judge boards with a KiCad the product does not
      # run, and a red (or green) result here would say nothing about the shipped board. As of 27 Tem 2026
      # the tag has NOT moved — this is prevention, not a repair, and it is NOT the explanation for any
      # past red run.
      # Pulling up front also means a registry hiccup fails here with a clear message, not mid-harness.
      - name: Pull the EDA images production runs (digest-pinned)
        run: |
          # Explicit rather than relying on the runner's default shell flags: this guard's whole job is to
          # stop a silent green, so it must not depend on an implicit `-e`.
          set -euo pipefail
          # assertImagesMatchProduction() throws if the pins have drifted from the Dockerfile, so a
          # half-done version bump fails HERE with a clear message instead of silently testing the
          # wrong binary. `set -e` (the default for a run block) turns that throw into a failed step.
          KICAD_IMAGE=$(node --input-type=module -e 'import { KICAD_IMAGE, assertImagesMatchProduction } from "./scripts/lib/eda-images.mjs"; assertImagesMatchProduction(); process.stdout.write(KICAD_IMAGE);')
          FR_IMAGE=$(node --input-type=module -e 'import { FR_IMAGE } from "./scripts/lib/eda-images.mjs"; process.stdout.write(FR_IMAGE);')
          echo "kicad:       $KICAD_IMAGE"
          echo "freerouting: $FR_IMAGE"
          docker pull "$KICAD_IMAGE"
          docker pull "$FR_IMAGE"

      # test:layout builds pcb-core then runs scripts/layout-check.mjs. STRICT makes an absent image
      # or a not-DRC-clean quality route a hard failure.
      - name: PCB layout gate (quality route + DRC notary, strict)
        env:
          PCB_GATE_STRICT: '1'
          MSYS_NO_PATHCONV: '1'
        run: pnpm test:layout
