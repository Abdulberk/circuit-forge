# Circuit Forge CI — every PR and every push to main runs the full quality gate.
#
# pnpm is installed with "npm i -g" (npm ships with Node) instead of the third-party
# pnpm/action-setup action, so the workflow runs even under the strictest repository
# Actions policy ("GitHub-owned actions only") — only actions/* are used.
#
# Two jobs:
#   • test     — install, build all workspaces, typecheck, and run every unit suite
#                (eda-core 220+, llm-core, api 118+ — all run env-less; live/AI suites are
#                gated behind env flags and auto-skip here).
#   • matrix   — the ngspice coverage matrix (83 translation-layer cells) + the edge-case
#                battery (numeric/convergence/safety/analysis/physics, analytic answers)
#                against a REAL apt ngspice. Catches CircuitJson→SPICE regressions that
#                unit tests can't (they don't execute ngspice).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + typecheck + tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The api suite includes REAL integration tests (auth / simulation / e2e-smoke) that boot the
    # full AppModule — they need live Postgres + Redis, provided as job services. S3/JWT values are
    # CI-only dummies (the storage client never connects in these suites).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: circuitforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # NOTE: jest's setup file (apps/api/__tests__/setup.ts) hard-sets every env the suites need
    # (DB/redis at localhost, JWT/S3/TME dummies) — only the MIGRATE step below runs outside jest
    # and needs DATABASE_URL itself.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/circuitforge_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm (version pinned to package.json "packageManager")
        run: npm install -g pnpm@8.14.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # A fresh install ships only the stub @prisma/client — without generate, the api build
        # fails with "Prisma has no exported member 'InputJsonValue'" (it worked locally only
        # because the client had been generated there once).
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Type-aware lint. This gate was DEAD until 2026-07-26: parserOptions.project was missing, so every
      # rule from recommended-requiring-type-checking threw on load and `pnpm lint` aborted in every
      # workspace — and CI never ran it, so nobody saw. It is wired here now that it exits clean.
      # What it gates: floating/misused promises (silent job loss in a queue worker is exactly this class),
      # new `any`, import hygiene, no-debugger, prefer-const. `any` PROPAGATION is intentionally a warning —
      # see the rationale in .eslintrc.js.
      - name: Lint
        run: pnpm lint

      # Formatting. Also dead until now — the config had never been applied, so this could not have
      # passed on any commit in the repo's history. Cheap to keep honest now that it does.
      - name: Format check
        run: pnpm format:check

      - name: Tests (unit + integration)
        run: pnpm test

  rust:
    name: pcb-placement-rs (cargo build + test)
    # The Rust placement kernel ships as a BINARY DEPENDENCY of the PCB pipeline
    # (apps/pcb-worker/src/runners/rust-placement.ts spawns `cf-pcb-place`), yet nothing in this repo
    # compiled it: `cargo` appeared in no workflow, and the TS side mocks execFile, so the binary never
    # ran in CI at all. Its 13 #[test]s pin concrete past failures — duplicate part ids collapsing to one
    # position while still reporting ok:true, a 1e300 net weight pushing coordinates non-finite while
    # still reporting ok:true, a 1e6mm board aborting on a 4.9TB allocation. Those classes could reach
    # a worker on a fully green pipeline. Runs on every PR (no path filter): the crate is small and the
    # cache keeps it around a minute, which is cheaper than reasoning about when it may be skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/pcb-placement-rs
    steps:
      - uses: actions/checkout@v4

      # Cargo.lock IS committed, so --locked makes the build reproducible and turns an unintended
      # dependency bump into a failure rather than a silent upgrade. Uses the runner's preinstalled
      # toolchain (edition 2024 needs >= 1.85); rustup only runs if it is older.
      - name: Ensure a toolchain new enough for edition 2024 (rust-version = 1.85)
        run: |
          cargo --version
          rustc --version
          MIN=1.85.0
          HAVE=$(rustc --version | awk '{print $2}')
          if [ "$(printf '%s\n%s\n' "$MIN" "$HAVE" | sort -V | head -1)" != "$MIN" ]; then
            echo "::notice::rustc $HAVE is older than $MIN — updating"
            rustup update stable && rustup default stable
          fi

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/pcb-placement-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/pcb-placement-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build (locked)
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked

  matrix:
    name: ngspice coverage matrix (apt / Ubuntu 24.04)
    # Runner PINNED (not ubuntu-latest) so the apt ngspice is DETERMINISTIC: ubuntu-24.04 ships ngspice-42.
    # A silent runner bump would swap the ngspice version under us (the repo has been burned by only-in-CI
    # ngspice drift), so the version is asserted below — a surprising major fails LOUDLY instead of being
    # quietly absorbed by the matrix cells' (deliberately version-tolerant) assertions.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@8.14.1

      - name: Install ngspice (pinned runner → ngspice-42; assert the major so drift is loud)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ngspice
          ngspice --version | head -2
          ngspice --version | grep -qE 'ngspice-4[0-9]' \
            || { echo "::error::apt ngspice major drifted off 4x on ubuntu-24.04 — re-verify the matrix and update this guard"; exit 1; }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build eda-core
        run: pnpm --filter @circuit-forge/eda-core build

      - name: Coverage matrix (real ngspice)
        env:
          NGSPICE_PATH: ngspice # the Linux apt build is the console binary
        run: node scripts/coverage-matrix.mjs

      - name: Edge-case battery (real ngspice — numeric/convergence/safety/analysis/physics)
        env:
          NGSPICE_PATH: ngspice
        run: node scripts/edge-cases.mjs
        # NOTE: scripts/runner-analyses-check.mjs (drives the ACTUAL worker runner.ts for each new analysis on
        # real ngspice) is a MANUAL QA tool — `pnpm test:runner` — NOT wired here: it needs the full worker-sim
        # build chain (llm-core + a generated Prisma client) which this lean matrix job deliberately avoids.
        # Verified manually on ngspice-41 (host) and ngspice-42 (apt) — 5/5 — for the QA-hardening pass.

      # Deterministic (seeded) real-ngspice regression harnesses — were runnable only locally (pnpm test:sweep /
      # test:fuzz); wired here so a CircuitJson→SPICE regression they'd catch can't merge. ~9s + ~24s locally.
      - name: Pairwise sweep (real ngspice — 200 deterministic parameter × name-edge combinations)
        env:
          NGSPICE_PATH: ngspice
        run: node scripts/pairwise-sweep.mjs

      - name: "Seeded fuzz (real ngspice — safety invariant: no crash / no silent-wrong on random circuits)"
        env:
          NGSPICE_PATH: ngspice
        run: node scripts/fuzz-circuits.mjs

      # Tier reachability. The engine grades a design against a bar and separately decides when to stop
      # sampling; those two were written independently and contradicted each other, so a design that never
      # failed a single variant could only ever be graded "marginal". Both halves had passing unit tests —
      # the contradiction lived only where they MEET, so it needs a check that runs the real sampler and
      # grades its real output. ~380 ngspice runs, a few seconds.
      - name: "Robustness tier is reachable (real ngspice — the product's headline claim)"
        env:
          NGSPICE_PATH: ngspice
        run: node scripts/robustness-tier-check.mjs

  matrix-alpine:
    name: ngspice coverage matrix (Alpine/musl — the PROD binary)
    # The apt matrix above tests ngspice-42; PRODUCTION runs the Alpine/musl ngspice from
    # infra/docker/worker-sim.Dockerfile (node:20-alpine3.23 → ngspice-45.2, KLU solver). That binary was
    # NEVER exercised by CI, so a musl/version-specific regression could ship. This job runs the SAME 83-cell
    # matrix + edge battery against the EXACT prod ngspice, in a container built from the same pinned base.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@8.14.1

      - name: Install + build eda-core (host — the dist is pure JS, runs unchanged on musl)
        # Full install (mirrors the apt matrix job) so tsc + all build deps resolve; then build eda-core only.
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @circuit-forge/eda-core build

      - name: Coverage matrix + edge battery on the PROD Alpine ngspice
        # Run the real-ngspice harnesses INSIDE the exact prod base image, READ from worker-sim.Dockerfile.
        # eda-core's only runtime dep is zod (pure JS) → installed fresh in the container; the built dist +
        # scripts are copied in read-only from the checkout. NGSPICE_PATH=ngspice = the apk console binary.
        run: |
          set -euo pipefail
          # DERIVE the base image from the Dockerfile instead of repeating it here. The two were coupled
          # only by a comment, so bumping the Alpine minor in production left this job validating the
          # PREVIOUS ngspice — the same "the gate judges a different binary than production runs" class
          # already closed for KiCad in scripts/lib/eda-images.mjs. Deriving beats asserting: there is no
          # second string left to disagree.
          BASE=$(awk '/^FROM node:/{print $2; exit}' infra/docker/worker-sim.Dockerfile)
          echo "PROD base image (from worker-sim.Dockerfile): $BASE"
          docker run --rm -v "$PWD:/repo:ro" "$BASE" sh -c '
            set -e
            apk add --no-cache ngspice >/dev/null
            echo "PROD ngspice: $(ngspice --version | grep -oE "ngspice-[0-9.]+" | head -1)"
            ngspice --version | grep -qE "ngspice-(4[5-9]|[5-9][0-9])" \
              || { echo "PROD Alpine ngspice major drifted below 45 — re-verify the matrix and update worker-sim.Dockerfile + this guard"; exit 1; }
            mkdir -p /tmp/w/packages/eda-core /tmp/w/scripts
            cp -r /repo/packages/eda-core/dist /tmp/w/packages/eda-core/dist
            cp -r /repo/scripts/. /tmp/w/scripts/
            cd /tmp/w && npm install zod@3 --no-save --silent >/dev/null 2>&1
            NODE_PATH=/tmp/w/node_modules NGSPICE_PATH=ngspice node scripts/coverage-matrix.mjs
            NODE_PATH=/tmp/w/node_modules NGSPICE_PATH=ngspice node scripts/edge-cases.mjs
          '
