# SonarQube analysis config for the circuit-forge pnpm+turbo monorepo.
# Run:  pnpm -r test:cov   (produces per-package coverage/lcov.info)
#       then a scan against the server, e.g.:  SONAR_TOKEN=<token> npx sonarqube-scanner
# Server URL + token are supplied at scan time (SONAR_HOST_URL / SONAR_TOKEN), not committed here.
sonar.projectKey=circuit-forge
sonar.projectName=circuit-forge
sonar.sourceEncoding=UTF-8

# Analyze the four workspaces' source. Tests live BOTH as *.spec.ts next to code AND in __tests__/ dirs, so we
# point sources+tests at the same roots and let the inclusion/exclusion patterns classify each file.
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/__tests__/**

# Keep generated / non-product / vendored code out of the "source" set (dist is gitignored but may exist locally).
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,**/coverage/**,scripts/**,**/prisma/migrations/**,**/*.spec.ts,**/*.test.ts,**/__tests__/**

# Coverage: the LCOV each workspace's `jest --coverage` emits.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/worker-sim/coverage/lcov.info,packages/eda-core/coverage/lcov.info,packages/llm-core/coverage/lcov.info

# TS config for type-aware rules.
sonar.typescript.tsconfigPath=tsconfig.base.json
